[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "private-email-agent"
version = "0.1.0"
description = "Local llama.cpp agent with Gmail retrieval tools over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[project.scripts]
private-email-agent = "private_email_agent.cli:main"
private-email-mcp = "private_email_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/private_email_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

